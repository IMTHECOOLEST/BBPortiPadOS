name: Bloodborne
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Bloodborne:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Build.xcconfig
      Release: Config/Build.xcconfig
    sources:
      - path: App/Sources
      - path: App/Native
      - path: App/Support/Assets.xcassets
      - path: App/bbpy
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bloodborne
        INFOPLIST_FILE: App/Support/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: App/Support/Bloodborne.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "$(BB_EXTRA_DEFINES)"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        SWIFT_OBJC_BRIDGING_HEADER: App/Native/Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/ios-deps/include"
          - "$(SRCROOT)/Vendor/pkgtool/include"
          - "$(SRCROOT)/Vendor/Python.xcframework/ios-arm64/Python.framework/Headers"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/ios-deps/lib"
          - "$(SRCROOT)/Vendor/runtime/lib"
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/Python.xcframework/ios-arm64"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lSDL3"
          - "-Wl,-export_dynamic"   # libbbgpu.dylib resolves runtime_* symbols against the app
          - "$(BB_RUNTIME_LDFLAGS)"
          - "$(BB_PKGTOOL_LDFLAGS)"
          - "-framework Python"
          - "-framework GameController"
          - "-framework CoreHaptics"
          - "-framework CoreMotion"
          - "-framework AVFAudio"
          - "-framework AVFoundation"
          - "-framework AudioToolbox"
          - "-framework CoreAudio"
          - "-framework CoreMedia"
          - "-framework CoreVideo"
          - "-framework Metal"
          - "-framework MetalKit"
          - "-framework QuartzCore"
          - "-framework UIKit"
          - "-framework UniformTypeIdentifiers"
          - "-framework ImageIO"
          - "-framework CoreGraphics"
    dependencies:
      # Python.xcframework holds a dynamic Python.framework: it has to be embedded in the app
      # (and signed with it), otherwise dyld cannot load it at launch.
      - framework: Vendor/Python.xcframework
        embed: true
        codeSign: true
    postBuildScripts:
      - name: Install Python stdlib
        basedOnDependencyAnalysis: false
        script: 'bash "$PROJECT_DIR/scripts/ios/install_python.sh"'
      - name: Embed runtime libraries
        basedOnDependencyAnalysis: false
        script: 'bash "$PROJECT_DIR/scripts/ios/embed_libs.sh"'
